name: "Bước 2A: Build AAB cho Google Play"
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.1.${{ github.run_number }}
      REMOTE_UPDATE: '0'   # bản Play: web nằm trong app, chạy offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Chuẩn bị khóa ký (nếu đã có secrets)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "SIGNED=1" >> $GITHUB_ENV
          else
            echo "::error::Chưa có khóa ký (secrets). Làm 'Bước 1' trước để build AAB đưa lên Google Play."
            exit 1
          fi
      - run: node scripts/prepare-config.js
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - name: Build
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon
      - name: Gom file kết quả
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/QRManager.aab
      - uses: actions/upload-artifact@v4
        with: { name: QRManager-play-aab, path: out/* }
      - name: Đăng lên Releases (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: out/* }
